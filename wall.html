<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>投影牆｜婚禮</title>
<!-- 芫荽（Iansui）：台灣繁體中文手寫風字體，含英文；Google Fonts 會依畫面上出現的字分段下載。 -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Iansui&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
               font-family: "Iansui", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  /* 影片佔掉跑馬燈以外的整個畫面，兩者互不遮蓋。 */
  video { position: fixed; left: 0; width: 100%; object-fit: contain; background: #000; }
  #band { position: fixed; left: 0; right: 0; overflow: hidden; background: #111; white-space: nowrap; }
  #band span { position: absolute; left: 0; top: 0; will-change: transform; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 18px; background: rgba(0, 0, 0, .85); font-size: 22px; text-align: center; padding: 24px; }
  #start[hidden] { display: none; }
  #start button { font: inherit; font-size: 32px; padding: 16px 40px; border: 0; border-radius: 12px; background: #c8962e; color: #fff; cursor: pointer; }
  #start label { font-size: 16px; color: #bbb; cursor: pointer; }
  #start input { font: inherit; font-size: 14px; color: #bbb; }
  #info { color: #e6c27a; max-width: 900px; }
</style>
</head>
<body>
<video id="vid" loop playsinline preload="auto" aria-label="婚禮迎賓輪播影片"></video>
<div id="band" aria-label="賓客祝福跑馬燈"></div>

<div id="start">
  <button id="go">▶ 開始播放（含聲音）</button>
  <p id="info">讀取設定中…</p>
  <label>雲端影片播不出來時，改用這台電腦裡的影片檔：<input type="file" id="local" accept="video/*"></label>
  <p style="font-size:14px;color:#888">按下開始後會進入全螢幕；按 Esc 離開全螢幕，重新整理會回到這個畫面。</p>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzicHEvp0czROJiyvUeZVZ0p8xrg7SwuvP4Jf6OkD8X3dJXebPp9C_0glsNd3aKCdTz/exec';
const KEY = new URLSearchParams(location.hash.slice(1)).get('k') || '';
// 每次問完後端（約 2 秒）再等 3 秒問下一次：新留言約 2–5 秒內就會排進跑馬燈，請求也不會重疊。
const POLL_MS = 3000;
const $ = id => document.getElementById(id);
const vid = $('vid'), band = $('band');

// 已播過的最後一則的時間。存在這台電腦的瀏覽器裡，重新整理後不會把舊留言再播一次。
let lastT = 0;
try { lastT = Number(localStorage.getItem('wallLastT')) || 0; } catch {}
let queue = [], speed = 120, size = 40, videoId = null, usingLocal = false, started = false;

// 從分享連結、網址或單純的 ID 取出雲端硬碟檔案 ID。
function driveId(s) {
  s = String(s || '').trim();
  const m = s.match(/\/d\/([\w-]{20,})/) || s.match(/[?&]id=([\w-]{20,})/) || s.match(/^([\w-]{20,})$/);
  return m ? m[1] : '';
}
console.assert(driveId('https://drive.google.com/file/d/1AbCdEfGhIjKlMnOpQrStUvWxYz/view?usp=sharing') === '1AbCdEfGhIjKlMnOpQrStUvWxYz'
  && driveId('https://drive.google.com/open?id=1AbCdEfGhIjKlMnOpQrStUvWxYz') === '1AbCdEfGhIjKlMnOpQrStUvWxYz' && driveId('') === '', 'driveId');

// 依後台設定擺放跑馬燈（上或下、字體大小、速度）。
function layout(s) {
  size = Math.min(200, Math.max(16, Number(s.wishSize) || 40));
  speed = Math.min(2000, Math.max(20, Number(s.wishSpeed) || 120));
  const h = Math.round(size * 1.7), bottom = ['下', 'bottom'].includes(String(s.wishPosition).trim());
  band.style.cssText = `height:${h}px;font-size:${size}px;line-height:${h}px;${bottom ? 'bottom' : 'top'}:0`;
  vid.style.top = bottom ? '0' : `${h}px`;
  vid.style.height = `calc(100% - ${h}px)`;
}

function setVideo(id) {
  if (usingLocal || id === videoId) return;
  videoId = id;
  if (!id) { $('info').textContent = '後台「設定」分頁的 wallVideo 還沒填影片連結。'; return; }
  $('info').textContent = '影片已設定。';
  // 雲端硬碟的直接下載網址支援分段讀取，瀏覽器可以邊下載邊播放；confirm=t 略過大檔案的病毒掃描提示頁。
  vid.src = `https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t`;
  if (started) vid.play().catch(() => {});
}
vid.onerror = () => {
  if (usingLocal) return;
  $('info').textContent = '雲端影片載入失敗：請確認共用設定為「知道連結的任何人」，或改用下方的本機影片檔。';
  $('start').hidden = false;
};

async function poll() {
  try {
    const d = await (await fetch(`${API}?k=${encodeURIComponent(KEY)}`)).json();
    if (d.error) { $('info').textContent = '連結無效，請用含金鑰的投影牆網址開啟。'; return; }
    layout(d.settings);
    setVideo(driveId(d.settings.wallVideo));
    const known = new Set(queue.map(w => w.t));
    for (const w of d.wishes) if (w.t > lastT && !known.has(w.t)) queue.push(w);
    queue.sort((a, b) => a.t - b.t);
  } catch {}   // 網路斷線就沿用現有內容，下次再試
}

// 依收到時間一則一則由右往左跑，每則只播一次；前一則完全進場並空出一段距離後，下一則才出發。
function runWish() {
  const w = queue.shift();
  if (!w) { setTimeout(runWish, 1000); return; }
  lastT = w.t;
  try { localStorage.setItem('wallLastT', String(lastT)); } catch {}
  const el = document.createElement('span');
  el.textContent = `${w.name || '賓客'}：${w.text}`;
  band.append(el);
  const W = band.clientWidth, w0 = el.offsetWidth, gap = Math.max(size * 6, W * 0.25);
  el.animate([{ transform: `translateX(${W}px)` }, { transform: `translateX(${-w0}px)` }],
             { duration: (W + w0) / speed * 1000, easing: 'linear', fill: 'both' }).onfinish = () => el.remove();
  // 用同一條動畫時間軸計時（不用 setTimeout）：畫面暫停繪製時兩者一起暫停，留言不會疊在一起。
  band.animate([], { duration: (w0 + gap) / speed * 1000 }).onfinish = runWish;
}

// 瀏覽器不允許網頁自動播放有聲音的影片，所以要先按一下「開始」。
$('go').onclick = () => {
  started = true;
  $('start').hidden = true;
  document.documentElement.requestFullscreen?.().catch(() => {});   // 全螢幕也順便把含金鑰的網址列藏起來
  vid.muted = false;
  vid.play().catch(() => { $('info').textContent = '影片無法播放，請確認連結或改用本機影片檔。'; $('start').hidden = false; });
};
$('local').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  usingLocal = true;
  vid.src = URL.createObjectURL(f);
  $('info').textContent = `將播放本機檔案：${f.name}`;
};

if (!KEY) $('info').textContent = '連結無效，請用含金鑰的投影牆網址開啟。';
else {
  const loop = () => poll().finally(() => setTimeout(loop, POLL_MS));
  poll().then(runWish).finally(() => setTimeout(loop, POLL_MS));
}
</script>
</body>
</html>
