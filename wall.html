<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>照片牆｜婚禮</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
               font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif; }
  img { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; }
  img.on { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) { img { transition: opacity .8s; } }
  #tip { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; padding: 14px; text-align: center;
         font-size: 26px; letter-spacing: .1em; background: rgba(0, 0, 0, .55); }
</style>
</head>
<body>
<img id="pic" alt="賓客上傳的照片">
<p id="tip">打開 LINE 選單「照片上傳」，您的照片會出現在這裡</p>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzicHEvp0czROJiyvUeZVZ0p8xrg7SwuvP4Jf6OkD8X3dJXebPp9C_0glsNd3aKCdTz/exec';
const SHOW_MS = 6000, POLL_MS = 20000;
const pic = document.getElementById('pic');
let all = [], queue = [];
const seen = new Set();

async function poll() {
  try {
    const list = await (await fetch(API)).json();   // 新到舊
    all = list.map(f => f.id);
    for (const id of [...all].reverse()) if (!seen.has(id)) { seen.add(id); queue.push(id); }
  } catch {}   // 網路斷線就沿用舊清單，下次再試
}

// 新照片優先播，播完後隨機輪播全部。
function next() {
  const id = queue.shift() ?? all[Math.floor(Math.random() * all.length)];
  const src = `https://drive.google.com/thumbnail?id=${id}&sz=w1920`;
  if (!id || src === pic.src) return;   // 同一張不重設，否則不會觸發 onload 而變黑
  pic.classList.remove('on');
  pic.src = src;
}
pic.onload = () => pic.classList.add('on');
pic.onerror = next;   // 剛上傳的檔案縮圖可能還沒好，跳下一張

poll().then(next);
setInterval(poll, POLL_MS);
setInterval(next, SHOW_MS);
</script>
</body>
</html>
