<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>照片上傳｜婚禮</title>
<style>
  :root { --gold: #c8962e; --ink: #222; }
  body { margin: 0 auto; max-width: 560px; padding: 24px 16px 48px; background: #fff; color: var(--ink);
         font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif; text-align: center; }
  .en { margin: 0; color: var(--gold); letter-spacing: .35em; font-size: 14px; }
  h1 { margin: 6px 0 4px; font-size: 30px; letter-spacing: .3em; font-weight: 600; }
  .sub { margin: 0 0 24px; color: var(--gold); font-size: 14px; letter-spacing: .1em; }
  .pick { position: relative; display: block; padding: 28px 14px; border-radius: 8px; background: var(--gold);
          color: #fff; font-size: 20px; cursor: pointer; }
  .pick:focus-within { outline: 3px solid #8a6414; outline-offset: 2px; }
  .pick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .pick.busy { opacity: .5; }
  #msg { min-height: 1.5em; margin: 16px 0 0; font-size: 18px; }
  #fail { color: #b00020; font-size: 15px; white-space: pre-line; }
  .note { font-size: 14px; color: #777; }
</style>
</head>
<body>
<header>
  <p class="en">SHARE YOUR PHOTOS</p>
  <h1>照片上傳</h1>
  <p class="sub">2026.12.05　柯民 &amp; 家青</p>
</header>

<label class="pick" id="pick">選擇照片或影片
  <input id="files" type="file" accept="image/*,video/*" multiple>
</label>
<p id="msg" role="status" aria-live="polite"></p>
<p id="fail"></p>
<p class="note">可一次選多張，上傳後會出現在現場大螢幕。<br>單一檔案上限 35 MB，較長的影片請私下傳給新人。</p>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzicHEvp0czROJiyvUeZVZ0p8xrg7SwuvP4Jf6OkD8X3dJXebPp9C_0glsNd3aKCdTz/exec';
// shortcut: Apps Script 單次請求上限約 50 MB（base64 後），所以單檔限 35 MB；要收大影片得改用 Drive 續傳上傳。
const MAX = 35 * 1024 * 1024;
const $ = id => document.getElementById(id);

const b64 = f => new Promise((ok, no) => {
  const r = new FileReader();
  r.onload = () => ok(r.result.split(',')[1]);
  r.onerror = no;
  r.readAsDataURL(f);
});

async function send(f) {
  const body = JSON.stringify({ name: f.name, type: f.type, data: await b64(f) });
  for (let i = 0; ; i++) {
    try {
      // 不設 Content-Type：維持 text/plain 才不會觸發 CORS preflight（Apps Script 不回應 OPTIONS）。
      const j = await (await fetch(API, { method: 'POST', body })).json();
      if (j.ok) return;
      throw new Error(j.error);
    } catch (e) {
      if (i >= 2) throw e;
      await new Promise(r => setTimeout(r, 2000));
    }
  }
}

$('files').addEventListener('change', async e => {
  const files = [...e.target.files];
  if (!files.length) return;
  e.target.disabled = true;
  $('pick').classList.add('busy');
  $('fail').textContent = '';
  let done = 0; const failed = [];
  for (const [i, f] of files.entries()) {
    $('msg').textContent = `上傳中 ${i + 1} / ${files.length}…請不要關閉此頁`;
    if (!/^(image|video)\//.test(f.type)) { failed.push(`${f.name}（只接受照片或影片）`); continue; }
    if (f.size > MAX) { failed.push(`${f.name}（超過 35 MB）`); continue; }
    try { await send(f); done++; } catch { failed.push(`${f.name}（上傳失敗，請再試一次）`); }
  }
  $('msg').textContent = done ? `已上傳 ${done} 個檔案，謝謝您的分享！` : '沒有檔案上傳成功。';
  $('fail').textContent = failed.join('\n');
  e.target.value = '';
  e.target.disabled = false;
  $('pick').classList.remove('busy');
});
</script>
</body>
</html>
