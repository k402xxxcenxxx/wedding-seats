<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>祝福留言｜婚禮</title>
<style>
  :root { --gold: #c8962e; --ink: #222; --line: #e6d9bf; }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 560px; padding: 24px 16px 48px; background: #fff; color: var(--ink);
         font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif; text-align: center; }
  .en { margin: 0; color: var(--gold); letter-spacing: .35em; font-size: 14px; }
  h1 { margin: 6px 0 4px; font-size: 30px; letter-spacing: .3em; font-weight: 600; }
  .sub { margin: 0 0 20px; color: var(--gold); font-size: 14px; letter-spacing: .1em; }
  label { display: block; margin-bottom: 8px; }
  input, textarea, button { font: inherit; font-size: 18px; padding: 12px 14px; border: 1px solid var(--gold); border-radius: 8px; }
  textarea { width: 100%; resize: vertical; }
  button { background: var(--gold); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; }
  .wide { width: 100%; margin-top: 10px; }
  .link { padding: 2px 8px; font-size: 14px; background: #fff; color: var(--gold); }
  .note { font-size: 14px; color: #777; }
  #msg { min-height: 1.5em; margin: 14px 0; font-size: 17px; }
</style>
</head>
<body>
<header>
  <p class="en">SEND YOUR WISHES</p>
  <h1>祝福留言</h1>
  <p class="sub">2026.12.05　柯民 &amp; 家青</p>
</header>

<form id="nameForm" hidden>
  <label for="name">請先輸入您的姓名</label>
  <div class="row">
    <input id="name" maxlength="20" required autocomplete="name">
    <button>開始</button>
  </div>
</form>

<main id="app" hidden>
  <p><span id="me"></span> <button type="button" class="link" id="rename">改名</button></p>
  <form id="wishForm">
    <label for="dm">想對新人說的話</label>
    <textarea id="dm" maxlength="50" rows="3" required placeholder="例如：新婚快樂，百年好合！🎉"></textarea>
    <button class="wide">送出祝福</button>
  </form>
  <p id="msg" role="status" aria-live="polite"></p>
  <p class="note">您的祝福會以跑馬燈出現在現場大螢幕上，每則播出一次。最多 50 字，可以用表情符號。</p>
</main>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzicHEvp0czROJiyvUeZVZ0p8xrg7SwuvP4Jf6OkD8X3dJXebPp9C_0glsNd3aKCdTz/exec';
// 通關金鑰放在網址的 # 後面（不會送到 GitHub 的伺服器），由 LINE 選單的連結帶進來。
const KEY = new URLSearchParams(location.hash.slice(1)).get('k') || '';
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ERR = { key: '連結無效，請從 LINE 選單重新開啟', closed: '目前未開放留言', quota: '已達每人的留言上限', empty: '請先輸入內容' };

// 每個裝置一組隨機 ID（後台用來計算每人上限，賓客看不到）；清除瀏覽器資料後會重新產生。
let me = null;
try { me = JSON.parse(localStorage.getItem('guest')); } catch {}

function setMe(name) {
  const id = me?.id || Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
  me = { id, name };
  try { localStorage.setItem('guest', JSON.stringify(me)); } catch {}   // 無痕模式存不了就只用這一次
  $('me').textContent = name;
  $('nameForm').hidden = true;
  $('app').hidden = false;
}

async function post(body) {
  body = JSON.stringify({ ...body, user: me.id, k: KEY });
  for (let i = 0; ; i++) {
    try {
      // 不設 Content-Type：維持 text/plain 才不會觸發 CORS preflight（Apps Script 不回應 OPTIONS）。
      return await (await fetch(API, { method: 'POST', body })).json();
    } catch (e) {
      if (i >= 2) throw e;
      await sleep(2000);
    }
  }
}

$('wishForm').addEventListener('submit', async e => {
  e.preventDefault();
  const text = $('dm').value.trim();
  if (!text) return;
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  $('msg').textContent = '送出中…';
  let r;
  try { r = await post({ action: 'wish', userName: me.name, text }); } catch { r = {}; }
  btn.disabled = false;
  if (r.ok) {
    $('dm').value = '';
    $('msg').textContent = r.review ? '已送出，審核後會出現在大螢幕。' : '已送出，稍後會跑過大螢幕！謝謝您的祝福 ❤️';
  } else {
    $('msg').textContent = ERR[r.error] || '送出失敗，請再試一次。';
  }
});

$('nameForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('name').value.trim();
  if (name) setMe(name);
});
$('rename').onclick = () => { $('name').value = me.name; $('app').hidden = true; $('nameForm').hidden = false; $('name').focus(); };

if (!KEY) { $('nameForm').hidden = true; document.body.append(Object.assign(document.createElement('p'), { textContent: ERR.key })); }
else if (me?.id && me.name) setMe(me.name);
else { me = null; $('nameForm').hidden = false; }
</script>
</body>
</html>
